<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280, height=720, initial-scale=1.0">
    <title>لوحة المشروع</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: 'Cairo', sans-serif;
            background-color: #0b0b0b;
        }

        .page-container {
            position: relative;
            width: 1280px;
            height: 720px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #121212;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
            flex-shrink: 0;
        }

        /* خلفية السلايدشو */
        .slideshow-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slide.active {
            opacity: 1;
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* طبقة التدرج اللوني */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgb(55 91 109 / 85%) 100%;
            z-index: 2;
        }

        /* المحتوى العام */
        .content-wrapper {
            position: relative;
            z-index: 3;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 35px 60px;
        }

        /* العنوان العلوي */
        .top-main-title-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-top: 10px;
            opacity: 0;
            transform: translateY(-20px);
            animation: fadeInDown 1.2s ease 0.2s forwards;
        }

        .top-main-title {
            color: #ffffff;
            font-size: 16px;
            letter-spacing: 1.5px;
            font-weight: 600;
        }

        /* تلوين Analysis Dashboard بالدرجة المطلوبة 1D3D4E */
        .top-main-title .highlight-accent {
            color: #1D3D4E;
        }

        /* العنوان الرئيسي في المنتصف */
        .header-section {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .header-texts h1 {
            font-size: 50px;
            color: #ffffff;
            margin-bottom: 12px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
            opacity: 0;
            transform: translateY(-20px);
            animation: fadeInDown 1.2s ease 1.0s forwards;
        }

        /* تلوين كلمة Analysis بالدرجة المطلوبة 1D3D4E */
        .header-texts h1 .highlight-word {
            color: #1D3D4E;
        }

        .header-texts p {
            font-size: 20px;
            color: #d1d1d1;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
            opacity: 0;
            transform: translateY(-20px);
            animation: fadeInDown 1.2s ease 2.2s forwards;
        }

        /* حاوية الكروت والأسهم */
        .carousel-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 15px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 1.2s ease 3.4s forwards;
        }

        .carousel-track-container {
            width: 900px;
            overflow: hidden;
            direction: ltr;
        }

        .carousel-track {
            display: flex;
            gap: 25px;
            transition: transform 0.4s ease-in-out;
            justify-content: flex-start;
        }

        /* تصميم الكارت الواحد */
        .card-item {
            min-width: 280px;
            height: 150px;
            background: rgba(29, 61, 78, 0.4);
            border: 1px solid rgba(226, 236, 241, 0.2);
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-decoration: none;
            transition: all 0.3s ease;
            position: relative;
            cursor: pointer;
            direction: rtl;
        }

        .card-item.active, .card-item:hover {
            border-color: #E2ECF1;
            background: rgba(226, 236, 241, 0.15);
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }

        .card-number {
            position: absolute;
            top: 12px;
            left: 15px;
            font-size: 12px;
            color: #E2ECF1;
            background: rgba(226, 236, 241, 0.2);
            padding: 2px 8px;
            border-radius: 20px;
        }

        .card-title {
            font-size: 17px;
            font-weight: 700;
            color: #ffffff;
            text-align: center;
            margin-top: 15px;
        }

        .card-indicator {
            width: 35px;
            height: 3px;
            background-color: #1D3D4E;
            border-radius: 2px;
            margin-top: 12px;
            transition: background 0.3s;
        }

        .card-item.active .card-indicator, .card-item:hover .card-indicator {
            background-color: #E2ECF1;
        }

        /* أزرار الأسهم للتحكم */
        .arrow-btn {
            background: rgba(29, 61, 78, 0.6);
            border: 1px solid rgba(226, 236, 241, 0.3);
            color: #ffffff;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .arrow-btn:hover {
            background-color: #E2ECF1;
            border-color: #E2ECF1;
            color: #1D3D4E;
        }

        @keyframes fadeInDown {
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="page-container">
        <!-- الخلفية المتغيرة -->
        <div class="slideshow-container">
            <div class="slide active"><img src="project4.1.png" alt="1"></div>
            <div class="slide"><img src="project4.2.jpg" alt="2"></div>
            <div class="slide"><img src="project4.3.png" alt="3"></div>
        </div>

        <div class="overlay"></div>

        <div class="content-wrapper">
            <!-- العنوان العلوي -->
            <div class="top-main-title-container">
                <div class="top-main-title">
                    Employees Leaving Work <span class="highlight-accent">Analysis Dashboard</span>
                </div>
            </div>

            <!-- العنوان والوصف في المنتصف -->
            <div class="header-section">
                <div class="header-texts">
                    <h1>Telco Customer Churn <span class="highlight-word">Analysis</span></h1>
                    <p>Understanding why customers leave, and predicting who will leave next</p>
                </div>
            </div>

            <!-- الكروت والأسهم في الأسفل -->
            <div class="carousel-section">
                <button class="arrow-btn" onclick="moveSlide(-1)">&#10094;</button>
                
                <div class="carousel-track-container">
                    <div class="carousel-track" id="track">
                        <!-- الصفحة الأولى -->
                        <div class="card-item active" onclick="selectCard(this)">
                            <span class="card-number">01</span>
                            <span class="card-title">Executive Overview</span>
                            <div class="card-indicator"></div>
                        </div>
                        <!-- الصفحة الثانية -->
                        <div class="card-item" onclick="selectCard(this)">
                            <span class="card-number">02</span>
                            <span class="card-title">Customer Profile & Services</span>
                            <div class="card-indicator"></div>
                        </div>
                        <!-- الصفحة الثالثة -->
                        <div class="card-item" onclick="selectCard(this)">
                            <span class="card-number">03</span>
                            <span class="card-title">Revenue & Billing</span>
                            <div class="card-indicator"></div>
                        </div>
                        <!-- الصفحة الرابعة -->
                        <div class="card-item" onclick="selectCard(this)">
                            <span class="card-number">04</span>
                            <span class="card-title">Churn Risk & ML Model</span>
                            <div class="card-indicator"></div>
                        </div>
                    </div>
                </div>

                <button class="arrow-btn" onclick="moveSlide(1)">&#10095;</button>
            </div>
        </div>
    </div>

    <script>
        // تغيير الصور في الخلفية تلقائياً
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');
        setInterval(() => {
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        }, 4000);

        // التفاعل عند الضغط على الكارت لتغيير حالة النشاط
        function selectCard(cardElement) {
            document.querySelectorAll('.card-item').forEach(card => {
                card.classList.remove('active');
            });
            cardElement.classList.add('active');
        }

        // حركة الكروت بالأسهم
        let currentIndex = 0;
        const track = document.getElementById('track');
        const totalCards = document.querySelectorAll('.card-item').length;
        const visibleCards = 3;

        function moveSlide(direction) {
            currentIndex += direction;
            if (currentIndex > totalCards - visibleCards) {
                currentIndex = 0; 
            } else if (currentIndex < 0) {
                currentIndex = totalCards - visibleCards;
            }
            const moveAmount = currentIndex * (280 + 25);
            track.style.transform = `translateX(-${moveAmount}px)`;
        }
    </script>

</body>
</html>
